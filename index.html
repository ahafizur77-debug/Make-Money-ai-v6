<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoneyMind AI V6</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header>
      <h1>MoneyMind AI <span>V6</span></h1>
      <p>Multi-Agent AI • Career • Opportunities • Planning</p>
    </header>

    <!-- Auth Section -->
    <section id="auth">
      <h3>Login or Create Account</h3>
      <input id="name" type="text" placeholder="Name (for registration only)" aria-label="Name">
      <input id="email" type="email" placeholder="Email" aria-label="Email" required>
      <input id="password" type="password" placeholder="Password" aria-label="Password" required>
      <input id="phone" type="tel" placeholder="Phone (optional)" aria-label="Phone">
      <div style="display: flex; gap: 10px; justify-content: center;">
        <button onclick="register()" class="primary">Create Account</button>
        <button onclick="login()" class="primary">Login</button>
      </div>
    </section>

    <!-- App Section (Hidden until logged in) -->
    <section id="app" hidden>
      <div class="bar">
        <strong id="who">Welcome!</strong>
        <button onclick="logout()" class="secondary">Logout</button>
      </div>

      <h3>Ask MoneyMind AI</h3>
      <textarea id="message" placeholder="Example: Make me a realistic income plan based on my skills." aria-label="Message"></textarea>
      <button onclick="chat()" class="primary">Ask AI</button>

      <div id="result"></div>

      <div id="plans"></div>

      <h3>Service Status</h3>
      <div id="status"></div>
    </section>

    <!-- Messages -->
    <p id="msg"></p>
  </main>

  <script src="/app.js"></script>
</body>
</html>
